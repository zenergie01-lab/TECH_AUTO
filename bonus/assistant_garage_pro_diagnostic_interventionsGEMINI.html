                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800/80 text-[11px] text-amber-300">
                      <strong>Règle d'or :</strong> Ne jamais desserrer ou serrer la vis de poulie Damper avec les piges en place (risque de tordre la pige ou le carter).
                    </div>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg space-y-3">
                    <div className="w-10 h-10 rounded-xl bg-sky-500/10 text-sky-400 border border-sky-500/30 flex items-center justify-center font-bold text-lg">
                      <i className="fa-solid fa-laptop-code"></i>
                    </div>
                    <h3 className="font-bold font-chakra text-slate-100 text-base">Valise Diag & Oscilloscope</h3>
                    <p className="text-xs text-slate-400 leading-relaxed">
                      Indispensables pour le retrait des pistons EPB, l'apprentissage des vannes EGR, le codage d'injecteurs et l'analyse de pression rail.
                    </p>
                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800/80 text-[11px] text-sky-300">
                      <strong>Conseil :</strong> Toujours maintenir la batterie du véhicule sous chargeur stabilisé (ex: Gysflash) lors des diag prolongés.
                    </div>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg space-y-3">
                    <div className="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 flex items-center justify-center font-bold text-lg">
                      <i className="fa-solid fa-compress"></i>
                    </div>
                    <h3 className="font-bold font-chakra text-slate-100 text-base">Repousse-Pistons & Outil SAC</h3>
                    <p className="text-xs text-slate-400 leading-relaxed">
                      Kit repousse-piston d'étrier à pas inversés pour freins arrière et centreur d'embrayage avec dispositif de réarmement pour mécanisme SAC.
                    </p>
                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800/80 text-[11px] text-emerald-300">
                      <strong>Entretien :</strong> Nettoyer et huiler les filetages des vis de presse régulièrement pour éviter le grippage sous contrainte.
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {}
          {selectedRepairModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto p-6 shadow-2xl space-y-6">
                <div className="flex items-start justify-between gap-4 border-b border-slate-800 pb-4">
                  <div>
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${selectedRepairModal.badgeColor}`}>
                      {selectedRepairModal.category}
                    </span>
                    <h3 className="text-xl font-bold font-chakra text-slate-100 mt-1">
                      {selectedRepairModal.title}
                    </h3>
                  </div>
                  <button 
                    onClick={() => setSelectedRepairModal(null)}
                    className="p-2 bg-slate-800 hover:bg-slate-700 text-slate-400 rounded-xl transition"
                  >
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                {/* Key Metrics */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-950 p-4 rounded-xl border border-slate-800">
                  <div>
                    <p className="text-[10px] text-slate-500 uppercase font-semibold">Durée Barèmée</p>
                    <p className="text-sm font-bold text-amber-400">{selectedRepairModal.formattedDuration}</p>
                  </div>
                  <div>
                    <p className="text-[10px] text-slate-500 uppercase font-semibold">Niveau d'Enjeu</p>
                    <p className="text-sm font-bold text-red-400">{selectedRepairModal.riskLevel}</p>
                  </div>
                  <div>
                    <p className="text-[10px] text-slate-500 uppercase font-semibold">Fréquence Garage</p>
                    <p className="text-sm font-bold text-slate-200">{selectedRepairModal.frequency}</p>
                  </div>
                </div>

                {/* Mandatory Tools */}
                <div>
                  <h4 className="text-xs font-bold text-amber-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                    <i className="fa-solid fa-toolbox"></i>
                    Outillage Obligatoire
                  </h4>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    {selectedRepairModal.mandatoryTools.map((tool, idx) => (
                      <div key={idx} className="bg-slate-950 p-2.5 rounded-xl border border-slate-800/80 text-xs text-slate-300 flex items-center gap-2">
                        <i className="fa-solid fa-wrench text-amber-500 text-[10px]"></i>
                        <span>{tool}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Consumables */}
                <div>
                  <h4 className="text-xs font-bold text-sky-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                    <i className="fa-solid fa-box-open"></i>
                    Pièces & Consumables à Prévoir
                  </h4>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    {selectedRepairModal.consumables.map((item, idx) => (
                      <div key={idx} className="bg-slate-950 p-2.5 rounded-xl border border-slate-800/80 text-xs text-slate-300 flex items-center gap-2">
                        <i className="fa-solid fa-oil-can text-sky-400 text-[10px]"></i>
                        <span>{item}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Check-list Pré-Intervention */}
                <div>
                  <h4 className="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                    <i className="fa-solid fa-list-check"></i>
                    Check-list d'Exécution Pas-à-Pas
                  </h4>
                  <div className="space-y-2">
                    {selectedRepairModal.preCheckList.map((step, idx) => (
                      <div key={idx} className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs text-slate-200 flex items-start gap-2.5">
                        <span className="w-5 h-5 rounded bg-emerald-500/20 text-emerald-400 font-bold flex items-center justify-center text-[10px] mt-0.5">
                          {idx + 1}
                        </span>
                        <span className="flex-1 leading-relaxed">{step}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Pro Tips / Pièges à éviter */}
                <div className="bg-amber-500/10 border border-amber-500/30 p-4 rounded-xl text-xs text-amber-200 flex items-start gap-3">
                  <i className="fa-solid fa-lightbulb text-amber-400 text-base mt-0.5"></i>
                  <div>
                    <strong className="text-amber-300 font-bold block mb-0.5">Conseil Expert Atelier :</strong>
                    {selectedRepairModal.proTips}
                  </div>
                </div>

                <div className="flex justify-end pt-2 border-t border-slate-800">
                  <button 
                    onClick={() => {
                      addToOR(selectedRepairModal);
                      setSelectedRepairModal(null);
                    }}
                    className="px-5 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-xl shadow-md transition"
                  >
                    Ajouter cette tâche à l'Ordre de Réparation
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
